name: Aurora TV APK
on:
  push:
    branches: ['codex/aurora-tvos-build']
    paths: ['aurora-tvos/**', '.github/workflows/aurora-tvos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar e verificar
        run: gradle -p aurora-tvos --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AuroraTV-APK
          path: aurora-tvos/app/build/outputs/apk/debug/app-debug.apk
