name: Aurora TV APK
on:
  push:
    branches: ['codex/aurora-tvos-build']
    paths: ['aurora-tvos/**', '.github/workflows/aurora-tvos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preservar assinatura de desenvolvimento
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aurora-glass-debug-key-v1
      - name: Compilar e verificar
        run: gradle -p aurora-tvos --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AuroraTV-APK
          path: aurora-tvos/app/build/outputs/apk/debug/app-debug.apk

  visual:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: AuroraTV-APK
          path: apk
      - name: Preparar aceleracao do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validar interface Android TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: bash aurora-tvos/scripts/check-tv.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AuroraTV-Preview
          path: preview/
